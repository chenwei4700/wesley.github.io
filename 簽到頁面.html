<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入頁面</title>
    <link rel="stylesheet" href="簽到頁面.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="outside">
        <div class="img-text-container">
            <img src="教會logo.png" alt="Logo">
            <h2><b>中華基督教衛理公會第18屆展開天使的翅膀慈音樂會</b></h2>
        </div>

        <div>
            <li><b>請選擇姓名或是買桌單位、姓名</b></li>
        </div>
        <div class="button">
            <button type="button" class="btn btn-outline-primary" id="nameQueryBtn">姓名</button>
            <button type="button" class="btn btn-outline-primary" id="noteQueryBtn">買桌單位、姓名</button>
        </div>

        <div>
            <li><b>請輸入姓名或是買桌單位、姓名</b></li>
        </div>

        <div class="wrapper">
            <div class="input-data">
                <input type="text" required id="queryInput">
                <div class="underline"></div>
                <label for="queryInput" id="inputLabel"></label>
            </div>
        </div>

        <div class="sent">
            <button type="button" class="btn btn-primary" id="submitBtn">確認送出</button>
        </div>

        <div class="message" id="errorMessage" style="display: none; color: red; font-weight: bold;">
            <b>輸入錯誤，請重新輸入，或查無資料。</b>
        </div>
        <div class="message" id="successMessage" style="display: none; color: green; font-weight: bold;">
            <b></b>
        </div>
        <div class="message" id="loadingMessage" style="display: none; color: gray; font-weight: bold;">
            <b>查詢中...</b>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        // 設定你的Google Apps Script Web App URL
        const GAS_WEB_APP_URL = 'YOUR_WEB_APP_URL'; // <-- 替換成你部署GAS後獲得的URL

        let currentQueryType = 'name'; // 預設為按姓名查詢

        const queryInput = document.getElementById('queryInput');
        const inputLabel = document.getElementById('inputLabel');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingMessage = document.getElementById('loadingMessage');
        const nameQueryBtn = document.getElementById('nameQueryBtn');
        const noteQueryBtn = document.getElementById('noteQueryBtn');
        const submitBtn = document.getElementById('submitBtn');

        // 頁面載入時設定預設標籤
        document.addEventListener('DOMContentLoaded', () => {
            inputLabel.innerText = '姓名';
            nameQueryBtn.classList.add('active'); // 預設選中姓名按鈕
        });

        nameQueryBtn.addEventListener('click', () => {
            currentQueryType = 'name';
            inputLabel.innerText = '姓名';
            nameQueryBtn.classList.add('active');
            noteQueryBtn.classList.remove('active');
            clearMessages();
        });

        noteQueryBtn.addEventListener('click', () => {
            currentQueryType = 'note';
            inputLabel.innerText = '買桌單位、姓名';
            noteQueryBtn.classList.add('active');
            nameQueryBtn.classList.remove('active');
            clearMessages();
        });

        submitBtn.addEventListener('click', async () => {
            const queryValue = queryInput.value.trim();
            clearMessages();

            if (!queryValue) {
                showErrorMessage('請輸入查詢內容！');
                return;
            }

            showLoadingMessage('查詢中...');

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    redirect: 'follow', // 處理GAS的重定向
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action: 'searchTable',
                        queryType: currentQueryType,
                        queryValue: queryValue
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                hideLoadingMessage();

                if (data.error) {
                    showErrorMessage(`查詢錯誤: ${data.error}`);
                    return;
                }

                if (data.length > 0) {
                    let message = `您好，查詢結果：<br>`;
                    data.forEach(item => {
                        message += `桌號: ${item.tableNumber}`;
                        if (item.name) message += `, 名字: ${item.name}`;
                        if (item.note) message += `, 備註: ${item.note}`;
                        message += `<br>`;
                    });
                    showSuccessMessage(message);
                } else {
                    showErrorMessage('查無此人或單位，請確認輸入是否正確。');
                }

            } catch (error) {
                hideLoadingMessage();
                console.error('Fetch error:', error);
                showErrorMessage('連線錯誤，請稍後再試。');
            }
        });

        function clearMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            loadingMessage.style.display = 'none';
            successMessage.innerHTML = '<b></b>'; // 清空成功訊息內容
        }

        function showErrorMessage(message) {
            errorMessage.innerHTML = `<b>${message}</b>`;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            loadingMessage.style.display = 'none';
        }

        function showSuccessMessage(message) {
            successMessage.innerHTML = `<b>${message}</b>`;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            loadingMessage.style.display = 'none';
        }

        function showLoadingMessage(message) {
            loadingMessage.innerHTML = `<b>${message}</b>`;
            loadingMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // 修改頁面標題
        // 因為 document.lastModified 在本地檔案可能不準確，建議在伺服器端生成或直接硬編碼
        // 如果您希望它動態顯示，確保此HTML是在一個Web伺服器上。
        // 對於本地文件，它通常是文件最後修改時間。
        const studentInfo = "您的系級加姓名"; // 請替換成您的資訊
        document.title = `${studentInfo} 於 ${document.lastModified} 定稿期末網站企劃書`;

    </script>
</body>

</html>
